<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planimetria</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        #plan-container {
            position: relative;
            cursor: not-allowed;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ */
            user-select: none; /* Standard syntax */
        }
        #security-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: #333;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">
    <div id="security-overlay">
        <p>La visibilità è stata persa. Ricarica la pagina.</p>
    </div>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12 text-center">
                <div class="card">
                    <div class="card-header">
                        <h3>Planimetria</h3>
                        <p class="text-muted">Per tutela dei proprietari la planimetria è visibile con watermark personale e non è scaricabile.</p>
                    </div>
                    <div class="card-body" id="plan-container">
                        <canvas id="plan-canvas"></canvas>
                    </div>
                    <div class="card-footer">
                        <a href="{{ url_for('main.post_view_questionnaire') }}" class="btn btn-primary">Prosegui</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('plan-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.src = "{{ url_for('main.serve_file', filename=asset_path) }}";

            img.onload = () => {
                // Set canvas size to image size
                canvas.width = img.width;
                canvas.height = img.height;

                // Draw the image
                ctx.drawImage(img, 0, 0);

                // Add watermark
                const watermarkText = "{{ lead.email }} - {{ now.strftime('%Y-%m-%d %H:%M') }} - Session: {{ session.session_id }}";
                ctx.font = "20px Arial";
                ctx.fillStyle = "rgba(255, 0, 0, 0.4)";
                ctx.textAlign = "center";

                // Add multiple watermarks
                for (let i = 0; i < canvas.height; i += 100) {
                    for (let j = 0; j < canvas.width; j += 300) {
                         ctx.save();
                         ctx.translate(j, i);
                         ctx.rotate(-0.45); // 45 degrees
                         ctx.fillText(watermarkText, 0, 0);
                         ctx.restore();
                    }
                }
            };

            img.onerror = () => {
                const container = document.getElementById('plan-container');
                container.innerHTML = '<p class="text-danger">Impossibile caricare la planimetria.</p>';
            };

            // Block printing
            window.onbeforeprint = () => {
                alert("La stampa non è consentita.");
                return false;
            };

            // Detect visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    document.getElementById('security-overlay').style.display = 'flex';
                }
            });

            // Block Ctrl+P and Cmd+P
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                    e.preventDefault();
                    alert("La stampa non è consentita.");
                }
            });
        });
    </script>
</body>
</html>
