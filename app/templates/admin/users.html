{% extends "admin/base.html" %}

{% block title %}Gestione Utenti{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Gestione Utenti Dipendenti</h1>
    <a href="{{ url_for('admin.add_user') }}" class="btn btn-success">Aggiungi Nuovo Utente</a>
</div>

<table class="table table-striped table-hover">
    <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Azioni</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.email }}</td>
            <td>
                <a href="{{ url_for('admin.edit_user', user_id=user.id) }}" class="btn btn-warning btn-sm">Modifica</a>
                <form action="{{ url_for('admin.delete_user', user_id=user.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Sei sicuro di voler eliminare questo utente? L\'operazione non può essere annullata.');">
                    <button type="submit" class="btn btn-danger btn-sm">Elimina</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3" class="text-center">Nessun utente trovato.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
