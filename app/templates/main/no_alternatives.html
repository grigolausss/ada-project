<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nessuna Alternativa</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2 text-center">
                <div class="card">
                    <div class="card-header">
                        <h3>Grazie per il feedback</h3>
                    </div>
                    <div class="card-body">
                        <p>Al momento non abbiamo trovato alternative immediate che corrispondano ai tuoi criteri.</p>
                        <p>Tuttavia, vorremmo comunque aiutarti. Lasciaci il tuo numero di telefono e un nostro consulente ti contatterà per una ricerca più approfondita e senza impegno.</p>

                        <form method="POST" action="{{ url_for('main.collect_phone_and_redirect') }}" class="mt-4">
                             <div class="form-group">
                                <label for="telefono">Numero di Telefono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Invia e vai al sito</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
