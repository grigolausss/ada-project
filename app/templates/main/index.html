<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Email</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3>Accedi ai dettagli dell’immobile</h3>
                        <p class="mb-0">Verifica la tua email per continuare</p>
                    </div>
                    <div class="card-body">
                        <div style="text-align: right; margin-bottom: 15px;">
                             <a href="{{ url_for('admin.login') }}">Accesso Dipendenti</a>
                        </div>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <form method="POST" action="{{ url_for('main.index') }}">
                            <div class="form-group">
                                <label for="nome">Nome</label>
                                <input type="text" class="form-control" id="nome" name="nome" required>
                            </div>
                            <div class="form-group">
                                <label for="cognome">Cognome</label>
                                <input type="text" class="form-control" id="cognome" name="cognome" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="form-group form-check">
                                <input type="checkbox" class="form-check-input" id="privacy_consent" name="privacy_consent" value="true" required>
                                <label class="form-check-label" for="privacy_consent">Acconsento al trattamento dei dati personali</label>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Ricevi codice</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
