{% extends "base.html" %}
{% block title %}Questionario di Pre-Qualifica{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card mt-4">
            <div class="card-header">
                <h3>Questionario di Pre-Qualifica</h3>
                <p>Rispondi a queste domande per accedere alla planimetria.</p>
            </div>
            <div class="card-body">
                <form id="questionnaire-form" method="POST" action="{{ url_for('main.questionnaire') }}">

                    <!-- Ha già un mutuo? -->
                    <div class="question-block">
                        <label><strong>Ha già un mutuo?</strong></label>
                        <input type="hidden" name="mutuo" id="mutuo-hidden" required>
                        <div>
                            <button type="button" class="btn answer-btn" data-question="mutuo" data-value="Sì">Sì</button>
                            <button type="button" class="btn answer-btn" data-question="mutuo" data-value="No">No</button>
                        </div>
                        <label for="mutuo_residuo" class="mt-2">Se sì, con quanto residuo?</label>
                        <input type="text" class="form-control" name="mutuo_residuo" id="mutuo_residuo" placeholder="Es: 100000">
                    </div>

                    <!-- Disponibilità liquida -->
                    <div class="question-block">
                        <label><strong>Ha disponibilità liquida per anticipo/spese?</strong></label>
                        <input type="hidden" name="liquidita" id="liquidita-hidden" required>
                        <div>
                            <button type="button" class="btn answer-btn" data-question="liquidita" data-value="Sì">Sì</button>
                            <button type="button" class="btn answer-btn" data-question="liquidita" data-value="No">No</button>
                            <button type="button" class="btn answer-btn other-btn" data-question="liquidita">Importo indicativo</button>
                        </div>
                        <input type="text" class="form-control mt-2 d-none" id="liquidita-other-text" placeholder="Specifica l'importo">
                    </div>

                    <!-- Necessità di finanziamento -->
                    <div class="question-block">
                        <label><strong>Necessità di finanziamento?</strong></label>
                        <input type="hidden" name="finanziamento" id="finanziamento-hidden" required>
                        <div>
                            <button type="button" class="btn answer-btn" data-question="finanziamento" data-value="Nessuna">Nessuna</button>
                            <button type="button" class="btn answer-btn" data-question="finanziamento" data-value="< 50%">Meno del 50%</button>
                            <button type="button" class="btn answer-btn" data-question="finanziamento" data-value="> 50%">Più del 50%</button>
                            <button type="button" class="btn answer-btn" data-question="finanziamento" data-value="100%">100%</button>
                        </div>
                    </div>

                    <!-- Tempistiche di acquisto -->
                    <div class="question-block">
                        <label><strong>Tempistiche di acquisto?</strong></label>
                        <input type="hidden" name="tempistiche" id="tempistiche-hidden" required>
                        <div>
                            <button type="button" class="btn answer-btn" data-question="tempistiche" data-value="Entro 1 mese">Entro 1 mese</button>
                            <button type="button" class="btn answer-btn" data-question="tempistiche" data-value="1-3 mesi">1-3 mesi</button>
                            <button type="button" class="btn answer-btn" data-question="tempistiche" data-value="3-6 mesi">3-6 mesi</button>
                            <button type="button" class="btn answer-btn" data-question="tempistiche" data-value="Oltre 6 mesi">Oltre 6 mesi</button>
                        </div>
                    </div>

                    <!-- Situazione attuale -->
                    <div class="question-block">
                        <label><strong>Situazione attuale?</strong></label>
                        <input type="hidden" name="situazione" id="situazione-hidden" required>
                        <div>
                            <button type="button" class="btn answer-btn" data-question="situazione" data-value="In affitto">In affitto</button>
                            <button type="button" class="btn answer-btn" data-question="situazione" data-value="Proprietario (deve vendere)">Proprietario (deve vendere)</button>
                            <button type="button" class="btn answer-btn" data-question="situazione" data-value="Convivenza">Convivenza</button>
                            <button type="button" class="btn answer-btn other-btn" data-question="situazione">Altro</button>
                        </div>
                        <input type="text" class="form-control mt-2 d-none" id="situazione-other-text" placeholder="Specifica la tua situazione">
                    </div>

                    <!-- Esigenze non negoziabili -->
                    <div class="question-block">
                        <label><strong>Esigenze non negoziabili? (multi-selezione)</strong></label>
                        <input type="hidden" name="esigenze" id="esigenze-hidden">
                        <div>
                            <button type="button" class="btn answer-btn multi-select" data-question="esigenze" data-value="Box">Box</button>
                            <button type="button" class="btn answer-btn multi-select" data-question="esigenze" data-value="Giardino">Giardino</button>
                            <button type="button" class="btn answer-btn multi-select" data-question="esigenze" data-value="Piano alto">Piano alto</button>
                            <button type="button" class="btn answer-btn multi-select" data-question="esigenze" data-value="Ascensore">Ascensore</button>
                            <button type="button" class="btn answer-btn multi-select" data-question="esigenze" data-value="Doppi servizi">Doppi servizi</button>
                        </div>
                        <input type="text" class="form-control mt-2" name="esigenze_altro" placeholder="Altre esigenze non negoziabili">
                    </div>

                    <!-- Consenso ricontatto -->
                    <div class="form-group form-check mt-4">
                        <input type="checkbox" class="form-check-input" id="ricontatto" name="ricontatto" value="true" required>
                        <label class="form-check-label" for="ricontatto">Consenso ad essere ricontattato per fissare appuntamento</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-4">Invia risposte e vedi planimetria</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Script is unchanged
</script>
{% endblock %}
