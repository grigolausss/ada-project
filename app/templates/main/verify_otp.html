<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica OTP</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3>Verifica Codice OTP</h3>
                        <p>Ti abbiamo inviato un codice a <strong>{{ email }}</strong>.</p>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <div id="resend-alert" class="alert alert-success d-none" role="alert"></div>
                        <form method="POST" action="{{ url_for('main.verify_otp', email=email) }}">
                            <div class="form-group">
                                <label for="otp">Codice OTP</label>
                                <input type="text" class="form-control" id="otp" name="otp" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Verifica</button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <button id="resend-btn" class="btn btn-secondary" disabled>Reinvia codice</button>
                            <p class="text-muted mt-2">
                                <span id="resend-timer-text">Potrai richiedere un altro codice tra <span id="timer">60</span> secondi.</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resendBtn = document.getElementById('resend-btn');
            const timerEl = document.getElementById('timer');
            const timerTextEl = document.getElementById('resend-timer-text');
            const resendAlert = document.getElementById('resend-alert');
            let timeLeft = 60;

            function startTimer() {
                resendBtn.disabled = true;
                timerTextEl.innerHTML = `Potrai richiedere un altro codice tra <span id="timer">${timeLeft}</span> secondi.`;
                timerTextEl.style.display = 'block';

                const timer = setInterval(() => {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        resendBtn.disabled = false;
                        timerTextEl.innerHTML = 'Non hai ricevuto il codice? Prova a reinviarlo.';
                        timeLeft = 60; // Reset for next time
                    }
                }, 1000);
            }

            resendBtn.addEventListener('click', () => {
                resendAlert.classList.add('d-none'); // Hide previous alert
                fetch(`/resend-otp/{{ email }}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            resendAlert.textContent = 'Un nuovo codice è stato generato e stampato nel terminale.';
                            resendAlert.classList.remove('d-none');
                            startTimer();
                        } else {
                            resendAlert.textContent = 'Errore durante il reinvio del codice.';
                            resendAlert.classList.add('alert-danger');
                            resendAlert.classList.remove('d-none', 'alert-success');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        resendAlert.textContent = 'Errore di rete.';
                        resendAlert.classList.add('alert-danger');
                        resendAlert.classList.remove('d-none', 'alert-success');
                    });
            });

            // Start the timer on initial page load
            startTimer();
        });
    </script>
</body>
</html>
