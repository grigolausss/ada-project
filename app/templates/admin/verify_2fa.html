{% extends "admin/base.html" %}

{% block title %}Verifica 2FA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card mt-5">
            <div class="card-header">
                <h3>Verifica a Due Fattori</h3>
            </div>
            <div class="card-body">
                <p>Controlla la tua email e inserisci il codice di verifica (OTP) che ti abbiamo inviato per completare l'accesso.</p>
                <form method="POST" action="{{ url_for('admin.verify_2fa') }}">
                    <div class="form-group">
                        <label for="otp">Codice OTP</label>
                        <input type="text" class="form-control" id="otp" name="otp" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Verifica e Accedi</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
